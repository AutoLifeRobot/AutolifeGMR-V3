name: Candidate
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, closed]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
# Current PR state is verified before explicitly cancelling older runs.
jobs:
  route:
    # Only the router cancels obsolete runs; source checks stay read-only.
    permissions:
      actions: write
      contents: read
      packages: read
      pull-requests: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.route.outputs.full }}
      build-number: ${{ steps.route.outputs.build_number }}
      head-sha: ${{ steps.route.outputs.head_sha }}
      base-sha: ${{ steps.route.outputs.base_sha }}
      head-ref: ${{ steps.route.outputs.head_ref }}
      pr-number: ${{ steps.route.outputs.pr_number }}
      release-id: ${{ steps.route.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: devops-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          persist-credentials: false
          lfs: false
      - uses: actions/github-script@v7
        id: route
        with:
          script: |
            const path = require('path');
            const root = path.join(process.env.GITHUB_WORKSPACE, `devops-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-${process.env.GITHUB_JOB}`);
            await require(path.join(root, 'ci/workflow_policy.cjs')).route({github, context, core, root, mode: 'candidate'});
  full:
    needs: route
    if: needs.route.outputs.full == 'true'
    uses: ./.github/workflows/reusable-full.yml
    secrets: inherit
    with:
      delivery-kind: candidate
      build-number: ${{ needs.route.outputs.build-number }}
      head-sha: ${{ needs.route.outputs.head-sha }}
      head-ref: ${{ needs.route.outputs.head-ref }}
      base-sha: ${{ needs.route.outputs.base-sha }}
      pr-number: ${{ needs.route.outputs.pr-number }}
  candidate-full-gate:
    needs: [route, full]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.route.result != 'success' || needs.route.outputs.full == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            for (const name of ['route', 'full']) {
              if (needs[name]?.result !== 'success') core.setFailed(`${name} did not actually succeed`);
            }
