name: Python Wheel Package

on:
  push:
    branches: ["autolife"]

jobs:
  build-for-x64:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Require Ubuntu 24.04 x86_64 build host
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          if [[ "$ID" != ubuntu || "$VERSION_ID" != 24.04 || "$(uname -m)" != x86_64 ]]; then
            echo "::error::This wheel must be built on Ubuntu 24.04 x86_64; generic runner labels are insufficient."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolate Python dependencies for this job
        shell: bash
        run: |
          set -euo pipefail
          venv="$(mktemp -d "$RUNNER_TEMP/autolife-python.XXXXXX")"
          python -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"
      - name: Install wheel build dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v cc
          command -v c++
          python -m pip install --upgrade pip setuptools packaging wheel mypy Cython
          python --version
          python -c "import sys; print(sys.executable)"
          python -c "import sysconfig; print('Include path:', sysconfig.get_path('include'))"

      - name: Build wheel
        shell: bash
        env:
          # Pass the run number as an environment variable
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e  # Exit immediately if any command fails
          python setup.py sdist bdist_wheel

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autolife-gmr-wheel
          path: dist/*.whl
