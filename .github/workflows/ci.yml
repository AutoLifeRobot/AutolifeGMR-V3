name: CI
on:
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, closed]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
# Current PR state is verified before explicitly cancelling older runs.
jobs:
  route:
    # Only the router cancels obsolete runs; source checks stay read-only.
    permissions:
      actions: write
      contents: read
      packages: read
      pull-requests: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    outputs:
      quick: ${{ steps.route.outputs.quick }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: devops-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          persist-credentials: false
          lfs: false
      - uses: actions/github-script@v7
        id: route
        with:
          script: |
            const path = require('path');
            const root = path.join(process.env.GITHUB_WORKSPACE, `devops-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-${process.env.GITHUB_JOB}`);
            await require(path.join(root, 'ci/workflow_policy.cjs')).route({github, context, core, root, mode: 'quick'});
  check:
    needs: route
    if: needs.route.outputs.quick == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/feat/v3-release-iso')
    uses: ./.github/workflows/reusable-full.yml
    secrets: inherit
    with:
      delivery-kind: quick
  iso-package:
    needs: route
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/v3-release-iso'
    uses: ./.github/workflows/reusable-full.yml
    secrets: inherit
    with:
      delivery-kind: development
      build-number: ${{ format('{0}', github.run_id) }}
  release-install:
    # Optional integration check. The component artifact already exists independently.
    needs: iso-package
    if: vars.ISO_VERIFY_WITH_RELEASE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Check out the pinned Release main installer
        uses: actions/checkout@v4
        with:
          repository: AutoLifeRobot/AutolifeRelease-V3
          ref: 4ce9a02f8cdc129c0fbf6099f318eed2c6d2375a
          path: release-validator
          token: ${{ secrets.BINARY_ARTIFACTS_TOKEN || github.token }}
          persist-credentials: false
      - name: Set isolated verification paths
        run: |
          echo "ISO_OUTPUT=$RUNNER_TEMP/iso-install-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/iso-install-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.iso-package.outputs.qualification-artifact-id }}
          path: ${{ env.ISO_OUTPUT }}/publication
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Import and install the original in a disposable deployment
        run: |
          python3 -I ci/release_contract.py --directory "$ISO_OUTPUT/publication" --release-tools release-validator
          bash ci/docker.sh image "$ISO_OUTPUT"
          bash ci/verify-install.sh "$ISO_OUTPUT" release-validator
